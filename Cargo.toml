[package]
name = "nixlayer"
version = "0.2.0"
edition = "2021"
description = "A focused package-list manager for NixOS that owns a small modules/nixlayer/ directory instead of your whole configuration."
license = "MIT"

[[bin]]
name = "nixlayer"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
regex = "1"
once_cell = "1"

[dev-dependencies]
tempfile = "=3.8.1"

[profile.release]
opt-level = 2
